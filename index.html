<!doctype html>

<style>
/* 版面概念：一個固定在畫面上的「鏡頭」，頁面捲動只負責推進時間。
   所有動畫皆為 CSS Scroll-Driven Animations（animation-timeline: scroll(root)），沒有 JavaScript。
   單一深色觀感：電影院般的黑底，畫面本身就是沙漠照片。 */
:root {
  --ink: #0d0b09;
  --paper: #f3ece0;
  --reel: #c8231d;
  --veil: rgb(13 11 9 / .62);
  --display: "Oswald", "Arial Narrow", "Helvetica Neue", sans-serif;
  --body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  color-scheme: dark;
}
html { background: var(--ink); }
body {
  background: var(--ink);
  color: var(--paper);
  font-family: var(--body);
  height: 1200vh;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.scene { position: fixed; inset: 0; overflow: hidden; container-type: size; background: var(--ink); }
/* 手機：網址列伸縮時不要讓畫面跟著跳動，固定用最大可視高度 */
@supports (height: 100lvh) { .scene { bottom: auto; height: 100lvh; } }
html, body { overscroll-behavior-y: none; }
body { -webkit-tap-highlight-color: transparent; }
/* 舞台＝沙漠照片的範圍，以 cover 方式填滿鏡頭；所有物件都用舞台的百分比定位 */
.stage {
  position: absolute;
  left: 50%;
  top: 50%;
  width: max(100cqw, 149.81cqh);
  height: max(100cqh, 66.75cqw);
  translate: -50% -50%;
}
.frames, .walker { position: absolute; inset: 0; pointer-events: none; }
.stage img { position: absolute; max-width: none; display: block; }
.stage img.bg { inset: 0; width: 100%; height: 100%; }
.final { opacity: 0; }
/* 背景與人物各只用一個圖層，捲動時換圖（手機記憶體才夠用） */
.bgseq { position: absolute; inset: 0; background: url(frames/f00.jpg) center / 100% 100% no-repeat; }
.wseq { position: absolute; background-size: 100% 100%; background-repeat: no-repeat; }
.preload { position: absolute; width: 1px; height: 1px; overflow: hidden; opacity: 0; pointer-events: none; }
.preload img { width: 1px; height: 1px; }
/* 人物：每一格是依攝影機透視算好的去背影格；色調調得接近褪色底片 */
.wseq { filter: sepia(.18) saturate(.82) contrast(.96) brightness(1.04); }
.sign {
  left: 34.239%;
  top: 43.863%;
  width: 22.089%;
  height: 30.192%;
  transform-origin: 64.148% 77.071%;   /* 以立牌底部為基準移動與縮放 */
  opacity: 0;
}
.sign-link {
  position: absolute;
  left: calc(34.239% + 22.089% * .3);
  top: calc(43.863% + 30.192% * .02);
  width: calc(22.089% * .66);
  height: calc(30.192% * .76);
  border-radius: 4px;
  cursor: pointer;
  visibility: hidden;                 /* 只有捲到最後一格時才能點 */
  z-index: 5;
}
@media (hover: hover) and (pointer: fine) { .sign-link:hover { box-shadow: 0 0 0 3px rgb(243 236 224 / .55); } }
.sign-link:focus-visible { outline: 3px solid var(--paper); outline-offset: 4px; }
.reel { position: fixed; left: 0; right: 0; top: 0; height: 3px; background: var(--reel); transform-origin: 0 50%; transform: scaleX(0); }
.fallback { display: none; }

/* =========================================================
   Scroll-Driven Animations：全部掛在 scroll(root)，keyframe 百分比 = 捲動進度
   ========================================================= */
@supports (animation-timeline: scroll()) {
  /* 每 3% 換一張背景、一張人物（step-end：在自己的 3% 內保持不變） */
  .bgseq, .wseq {
    animation-duration: auto;
    animation-timing-function: step-end;
    animation-fill-mode: both;
    animation-timeline: scroll(root);
  }
  .bgseq { animation-name: bgseq; }
  .wseq { animation-name: wseq; }
  @keyframes bgseq {
    0% { background-image: url(frames/f00.jpg); }
    3% { background-image: url(frames/f01.jpg); }
    6% { background-image: url(frames/f02.jpg); }
    9% { background-image: url(frames/f03.jpg); }
    12% { background-image: url(frames/f04.jpg); }
    15% { background-image: url(frames/f05.jpg); }
    18% { background-image: url(frames/f06.jpg); }
    21% { background-image: url(frames/f07.jpg); }
    24% { background-image: url(frames/f08.jpg); }
    27% { background-image: url(frames/f09.jpg); }
    30% { background-image: url(frames/f10.jpg); }
    33% { background-image: url(frames/f11.jpg); }
    36% { background-image: url(frames/f12.jpg); }
    39% { background-image: url(frames/f13.jpg); }
    42% { background-image: url(frames/f14.jpg); }
    45% { background-image: url(frames/f15.jpg); }
    48% { background-image: url(frames/f16.jpg); }
    51% { background-image: url(frames/f17.jpg); }
    54% { background-image: url(frames/f18.jpg); }
    57% { background-image: url(frames/f19.jpg); }
    60% { background-image: url(frames/f20.jpg); }
    63% { background-image: url(frames/f21.jpg); }
    66% { background-image: url(frames/f22.jpg); }
    69% { background-image: url(frames/f23.jpg); }
    72% { background-image: url(frames/f24.jpg); }
    75% { background-image: url(frames/f25.jpg); }
    78% { background-image: url(frames/f26.jpg); }
    81% { background-image: url(frames/f27.jpg); }
    84% { background-image: url(frames/f28.jpg); }
    87% { background-image: url(frames/f29.jpg); }
    90% { background-image: url(frames/f30.jpg); }
    93% { background-image: url(frames/f31.jpg); }
    96% { background-image: url(frames/f32.jpg); }
    99% { background-image: url(frames/f33.jpg); }
    100% { background-image: url(frames/f33.jpg); }
  }
  @keyframes wseq {
    0% { left: 33.625%; top: 30.056%; width: 19.188%; height: 20.412%; background-image: url(walk/w00.webp); visibility: visible; }
    3% { left: 33.125%; top: 30.712%; width: 19.812%; height: 20.974%; background-image: url(walk/w01.webp); visibility: visible; }
    6% { left: 32.562%; top: 31.367%; width: 20.562%; height: 21.536%; background-image: url(walk/w02.webp); visibility: visible; }
    9% { left: 32%; top: 32.116%; width: 21.25%; height: 22.285%; background-image: url(walk/w03.webp); visibility: visible; }
    12% { left: 31.312%; top: 32.959%; width: 22.062%; height: 22.94%; background-image: url(walk/w04.webp); visibility: visible; }
    15% { left: 30.625%; top: 33.895%; width: 22.938%; height: 23.689%; background-image: url(walk/w05.webp); visibility: visible; }
    18% { left: 29.688%; top: 35.019%; width: 24.188%; height: 24.345%; background-image: url(walk/w06.webp); visibility: visible; }
    21% { left: 28.938%; top: 36.236%; width: 25.125%; height: 25.094%; background-image: url(walk/w07.webp); visibility: visible; }
    24% { left: 28%; top: 37.64%; width: 26.375%; height: 25.936%; background-image: url(walk/w08.webp); visibility: visible; }
    27% { left: 27.062%; top: 39.232%; width: 27.562%; height: 26.779%; background-image: url(walk/w09.webp); visibility: visible; }
    30% { left: 26.062%; top: 41.199%; width: 28.875%; height: 27.528%; background-image: url(walk/w10.webp); visibility: visible; }
    33% { left: 24.875%; top: 43.446%; width: 30.75%; height: 28.277%; background-image: url(walk/w11.webp); visibility: visible; }
    36% { left: 23.625%; top: 46.255%; width: 32.5%; height: 28.933%; background-image: url(walk/w12.webp); visibility: visible; }
    39% { left: 21.812%; top: 48.221%; width: 34.688%; height: 30.899%; background-image: url(walk/w13.webp); visibility: visible; }
    42% { left: 19.75%; top: 50.375%; width: 37.25%; height: 33.24%; background-image: url(walk/w14.webp); visibility: visible; }
    45% { left: 17.375%; top: 52.996%; width: 40.188%; height: 35.768%; background-image: url(walk/w15.webp); visibility: visible; }
    48% { left: 14.562%; top: 55.993%; width: 43.625%; height: 38.858%; background-image: url(walk/w16.webp); visibility: visible; }
    51% { left: 35.562%; top: 62.547%; width: 29.25%; height: 37.453%; background-image: url(walk/w17.webp); visibility: visible; }
    54% { left: 34.062%; top: 78.464%; width: 29.25%; height: 21.536%; background-image: url(walk/w18.webp); visibility: visible; }
    57% { left: 31.125%; top: 84.925%; width: 34.125%; height: 15.075%; background-image: url(walk/w19.webp); visibility: visible; }
    60%, 100% { visibility: hidden; background-image: none; }
  }

  .walker, .frames, .sign, .final, .reel {
    animation-timing-function: linear;
    animation-fill-mode: both;
    animation-duration: auto;
    animation-timeline: scroll(root);
  }
  /* 人物景深：開場失焦，0–45% 漸漸對上焦 */
  /* 人物走出後（61% 起）整組隱藏，雙重保險：捲到底時不會殘留任何人物影格 */
  .walker { animation-name: man-focus, walker-out; }
  @keyframes walker-out { 0%, 60.9% { visibility: visible; } 61%, 100% { visibility: hidden; } }
  @keyframes man-focus { 0% { filter: blur(0.4cqh); } 45%, 100% { filter: blur(0); } }
  /* 焦點拉到人物時背景微微失焦，人物走出後回到清楚 */
  .frames { animation-name: bg-focus; }
  @keyframes bg-focus { 0%, 20% { filter: blur(0); } 45%, 58% { filter: blur(.3cqh); } 63%, 100% { filter: blur(0); } }
  /* 立牌：61% 在遠處出現，每 3% 跟著背景前進一格，99% 停在圖五的位置 */
  .sign { animation-name: sign-walk, sign-focus; }
  @keyframes sign-walk {
  0% { transform: translate(6.989%, -158.493%) scale(0.03); opacity: 0; animation-timing-function: step-end; }
  61% { transform: translate(6.989%, -158.493%) scale(0.03); opacity: 1; animation-timing-function: step-end; }
  63% { transform: translate(6.923%, -156.975%) scale(0.039); opacity: 1; animation-timing-function: step-end; }
  66% { transform: translate(6.835%, -154.987%) scale(0.051); opacity: 1; animation-timing-function: step-end; }
  69% { transform: translate(6.72%, -152.384%) scale(0.067); opacity: 1; animation-timing-function: step-end; }
  72% { transform: translate(6.57%, -148.976%) scale(0.088); opacity: 1; animation-timing-function: step-end; }
  75% { transform: translate(6.373%, -144.511%) scale(0.116); opacity: 1; animation-timing-function: step-end; }
  78% { transform: translate(6.115%, -138.664%) scale(0.151); opacity: 1; animation-timing-function: step-end; }
  81% { transform: translate(5.777%, -131.008%) scale(0.198); opacity: 1; animation-timing-function: step-end; }
  84% { transform: translate(5.335%, -120.98%) scale(0.26); opacity: 1; animation-timing-function: step-end; }
  87% { transform: translate(4.756%, -107.848%) scale(0.34); opacity: 1; animation-timing-function: step-end; }
  90% { transform: translate(3.998%, -90.649%) scale(0.445); opacity: 1; animation-timing-function: step-end; }
  93% { transform: translate(3.004%, -68.126%) scale(0.583); opacity: 1; animation-timing-function: step-end; }
  96% { transform: translate(1.704%, -38.629%) scale(0.764); opacity: 1; animation-timing-function: step-end; }
  99% { transform: translate(0%, 0%) scale(1); opacity: 1; animation-timing-function: step-end; }
  100% { transform: none; opacity: 1; }
  }
  @keyframes sign-focus {
  0% { filter: blur(0); }
  61% { filter: blur(2.858cqh); animation-timing-function: step-end; }
  63% { filter: blur(2.497cqh); animation-timing-function: step-end; }
  66% { filter: blur(2.182cqh); animation-timing-function: step-end; }
  69% { filter: blur(1.907cqh); animation-timing-function: step-end; }
  72% { filter: blur(1.666cqh); animation-timing-function: step-end; }
  75% { filter: blur(1.456cqh); animation-timing-function: step-end; }
  78% { filter: blur(1.272cqh); animation-timing-function: step-end; }
  81% { filter: blur(1.112cqh); animation-timing-function: step-end; }
  84% { filter: blur(0.972cqh); animation-timing-function: step-end; }
  87% { filter: blur(0.849cqh); animation-timing-function: step-end; }
  88% { filter: blur(0.849cqh); }
  88.5% { filter: blur(0.844cqh); }
  89% { filter: blur(0.829cqh); }
  89.5% { filter: blur(0.806cqh); }
  90% { filter: blur(0.592cqh); }
  90.5% { filter: blur(0.563cqh); }
  91% { filter: blur(0.53cqh); }
  91.5% { filter: blur(0.493cqh); }
  92% { filter: blur(0.453cqh); }
  92.5% { filter: blur(0.412cqh); }
  93% { filter: blur(0.281cqh); }
  93.5% { filter: blur(0.248cqh); }
  94% { filter: blur(0.214cqh); }
  94.5% { filter: blur(0.181cqh); }
  95% { filter: blur(0.149cqh); }
  95.5% { filter: blur(0.118cqh); }
  96% { filter: blur(0.069cqh); }
  96.5% { filter: blur(0.05cqh); }
  97% { filter: blur(0.033cqh); }
  97.5% { filter: blur(0.019cqh); }
  98% { filter: blur(0.009cqh); }
  98.5% { filter: blur(0.002cqh); }
  99% { filter: blur(0cqh); }
  100% { filter: blur(0); }
  }
  .final { animation-name: final-frame; }
  @keyframes final-frame { 0%, 98.8% { opacity: 0; } 100% { opacity: 1; } }
  /* 告示牌停在圖五的位置後（98% 起）才變成可點的連結 */
  .sign-link { animation: sign-link linear both; animation-timeline: scroll(root); }
  @keyframes sign-link { 0%, 97.9% { visibility: hidden; } 98%, 100% { visibility: visible; } }
  .reel { animation-name: reel; }
  @keyframes reel { to { transform: scaleX(1); } }
}

/* 不支援或使用者要求減少動態：直接給最後一格 */
@supports not (animation-timeline: scroll()) {
  body { height: 100%; }
  .walker, .sign, .reel { display: none; }
  .final { opacity: 1; }
  .sign-link { visibility: visible; }
  .fallback { display: block; }
}
@media (prefers-reduced-motion: reduce) {
  body { height: 100%; }
  .walker, .sign, .reel { display: none; }
  .final { opacity: 1; animation: none !important; }
  .sign-link { visibility: visible; animation: none !important; }
  .fallback { display: block; }
}
.fallback {
  position: fixed;
  top: calc(16px + env(safe-area-inset-top, 0px));
  left: max(16px, env(safe-area-inset-left, 0px));
  right: max(16px, env(safe-area-inset-right, 0px));
  max-width: 34rem;
  background: var(--veil);
  padding: .9rem 1.1rem;
  border-radius: 6px;
  line-height: 1.6;
  font-size: .95rem;
}

/* 影片彈出視窗：瀏覽器原生 popover，點視窗外的暗處即可收起 */
button.sign-link { background: transparent; border: 0; padding: 0; font: inherit; color: inherit; }
.video-pop {
  width: min(92vw, 960px);
  max-height: 92svh;
  padding: 0;
  border: 0;
  border-radius: 6px;
  background: var(--ink);
  color: var(--paper);
  overflow: hidden;
  box-shadow: 0 20px 60px rgb(0 0 0 / .6);
}
.video-pop::backdrop { background: rgb(13 11 9 / .82); }
.video-frame { position: relative; aspect-ratio: 16 / 9; background: #000; max-height: 92svh; margin-inline: auto; }
.video-frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.video-bar { display: flex; justify-content: space-between; align-items: center; gap: 12px;
             padding: 10px 14px; font-size: .95rem; letter-spacing: .04em; }
.video-bar a { color: var(--paper); }
.video-bar button { background: transparent; color: var(--paper); border: 1px solid rgb(243 236 224 / .5);
                    border-radius: 999px; padding: .4em 1.1em; font: inherit; cursor: pointer; }
.video-bar button:focus-visible, .video-bar a:focus-visible { outline: 2px solid var(--paper); outline-offset: 3px; }
</style>
</head>
